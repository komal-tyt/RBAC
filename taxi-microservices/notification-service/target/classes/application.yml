spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:h2:mem:user_db
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8083

notification:
  worker:
    pool-size: 4
    poll-interval-ms: 5000
    max-retries: 3

logging:
  level:
    com.taxi: DEBUG