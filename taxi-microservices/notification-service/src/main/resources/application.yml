spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/taxi_db
    username: taxi_user
    password: taxi_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8083
z
notification:
  worker:
    pool-size: 4
    poll-interval-ms: 5000
    max-retries: 3

logging:
  level:
    com.taxi: DEBUG