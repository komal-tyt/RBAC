spring:
  application:
    name: trip-service
  datasource:
    url: jdbc:postgresql://localhost:5432/taxi_db
    username: taxi_user
    password: taxi_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8082

user-service:
  url: http://localhost:8081

notification-service:
  url: http://localhost:8083

logging:
  level:
    com.taxi: DEBUG