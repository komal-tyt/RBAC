spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/taxi_db
    username: taxi_user
    password: taxi_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8081

logging:
  level:
    com.taxi: DEBUG
    org.hibernate.SQL: DEBUG