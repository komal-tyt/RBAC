spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/taxi_db
    username: taxi_user
    password: taxi_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false  
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
    open-in-view: false

server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: never

logging:
  level:
    com.taxi: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"